name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate the marketplace and the plugin
        run: |
          npx -y @anthropic-ai/claude-code@latest plugin validate . --strict
          npx -y @anthropic-ai/claude-code@latest plugin validate plugins/clausebench --strict
      - name: The MCP server starts and lists its tools
        run: |
          (printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 3) \
            | node plugins/clausebench/mcp/server.mjs | grep -q resolve_vendors
